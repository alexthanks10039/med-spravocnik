name: iOS CI

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/ios-ci.yml'

jobs:
  ios:
    timeout-minutes: 30
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
