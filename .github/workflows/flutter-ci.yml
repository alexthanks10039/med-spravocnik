name: Flutter CI

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  flutter:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: flutter-pubspec-lock
          path: flutter_app/pubspec.lock
          retention-days: 1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release
